data:
  data_dir: ./data/vindr
  image_size: 512
  train_batch_size: 16
  val_batch_size: 32
  num_workers: 4
  train_fraction: 1.0

model:
  backbone: tf_efficientnet_b0
  pretrained: true
  num_classes: 28

train:
  epochs: 25
  lr: 3e-4
  weight_decay: 1e-5
  scheduler: cosine
  warmup_epochs: 2
  mixed_precision: true
  seed: 42
  accumulation_steps: 2

optimization:
  gradient_clip: 1.0

logging:
  log_every: 50
  eval_every_epoch: 1
  output_dir: ./runs
  run_name: vdr_b0_512
  save_best_metric: auroc_mean