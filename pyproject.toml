[project]
name = "radiology-ai"
version = "0.1.0"
description = "AI interpretation of imaging studies: CXR multi-label classification (VinDr-CXR), roadmap to CT and MRI"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=1.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "Pillow>=10.0",
    "pydicom>=2.4",
    "albumentations>=1.4",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "pydantic>=2.6",
    "scikit-learn>=1.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "ultralytics>=8.4.155",
    "nibabel>=5.4.2",
    "simpleitk>=2.5.6",
]

[project.scripts]
vindr-train = "vindr.train:main"
vindr-predict = "vindr.predict:main"
vindr-prepare = "vindr.prepare:main"
vindr-eda = "vindr.eda:main"
vindr-ct-train = "vindr.ct.train:main"
vindr-ct-seg-train = "vindr.ct.train_seg:main"
vindr-ct-predict = "vindr.ct.predict:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
