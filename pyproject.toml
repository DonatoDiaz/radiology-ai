[project]
name = "vindr-classifier"
version = "0.1.0"
description = "Multi-label classification of chest X-rays (VinDr-CXR) for radiology triage"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=1.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "Pillow>=10.0",
    "pydicom>=2.4",
    "albumentations>=1.4",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "pydantic>=2.6",
    "scikit-learn>=1.4",
]

[project.scripts]
vindr-train = "vindr.train:main"
vindr-predict = "vindr.predict:main"
vindr-prepare = "vindr.prepare:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]